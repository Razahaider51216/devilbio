<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title id="page-title">BIO</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="c" id="app">
  <div class="topbar">
    <span class="tag" id="t-tag">// BIO.PAGE</span>
    <div class="dot-row"><div class="dot"></div><span>ONLINE</span></div>
  </div>
  <div class="profile">
    <div class="av-wrap" id="avWrap">
      <span class="av-tap">tap ×5 to unlock</span>
    </div>
    <div>
      <h1 class="pname" id="pname"></h1>
      <p class="phandle" id="phandle"></p>
    </div>
    <p class="ptitle" id="ptitle"></p>
    <p class="pbio" id="pbio"></p>
  </div>
  <div class="div">LINKS</div>
  <div class="links" id="links"></div>
  <div class="foot"><span id="fName"></span> · bio.page · cf</div>
</div>

<!-- lock button -->
<button id="lockBtn">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="11" width="18" height="11" rx="1"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
</button>

<!-- auth overlay -->
<div class="ov" id="authOv">
  <div class="modal">
    <div class="m-title">// <b>AUTH</b></div>
    <label class="lbl" for="pwIn">PASSWORD</label>
    <input type="password" id="pwIn" placeholder="enter password" autocomplete="off">
    <div class="err" id="pwErr">// access denied</div>
    <div class="row">
      <button class="btn btn-g" id="authCancel">CANCEL</button>
      <button class="btn btn-p" id="authOk">ENTER →</button>
    </div>
  </div>
</div>

<!-- link edit overlay -->
<div class="ov" id="linkOv">
  <div class="modal">
    <div class="m-title">// <b id="lmTitle">LINK</b></div>
    <input type="hidden" id="lmId">
    <label class="lbl">PLATFORM</label>
    <select id="lmPlatform">
      <option value="facebook">Facebook</option>
      <option value="line">LINE</option>
      <option value="instagram">Instagram</option>
      <option value="discord">Discord</option>
      <option value="twitter">Twitter / X</option>
      <option value="github">GitHub</option>
      <option value="tiktok">TikTok</option>
      <option value="youtube">YouTube</option>
      <option value="telegram">Telegram</option>
      <option value="whatsapp">WhatsApp</option>
      <option value="email">Email</option>
      <option value="website">Website</option>
    </select>
    <label class="lbl" for="lmLabel">LABEL</label>
    <input type="text" id="lmLabel" placeholder="Display label">
    <label class="lbl" for="lmUrl">URL / ID</label>
    <input type="url" id="lmUrl" placeholder="https://...">
    <div class="row">
      <button class="btn btn-g" id="lmCancel">CANCEL</button>
      <button class="btn btn-p" id="lmSave">SAVE</button>
    </div>
  </div>
</div>

<!-- panel backdrop -->
<div id="panel-backdrop"></div>

<!-- admin panel -->
<div id="panel">
  <div class="ph">
    <span class="ph-title">// ADMIN PANEL</span>
    <button class="ph-close" id="phClose">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="pb">
    <div class="ps">
      <div class="ps-title">PROFILE</div>
      <div class="ap">
        <div id="apPrev"></div>
        <div class="ap-inp">
          <label class="lbl">AVATAR URL</label>
          <div style="display:flex;gap:.35rem">
            <input type="url" id="aUrl" placeholder="https://...">
            <button class="btn btn-g btn-w" onclick="applyAv()">SET</button>
          </div>
        </div>
      </div>
      <label class="lbl" for="aName">NAME</label>
      <input type="text" id="aName">
      <label class="lbl" for="aHandle">HANDLE</label>
      <input type="text" id="aHandle" placeholder="@handle">
      <label class="lbl" for="aTitle">TITLE</label>
      <input type="text" id="aTitle">
      <label class="lbl" for="aBio">BIO</label>
      <textarea id="aBio" rows="3"></textarea>
      <label class="lbl" for="aPw">NEW PASSWORD</label>
      <input type="password" id="aPw" placeholder="leave blank to keep">
      <button class="btn btn-p" onclick="saveProfile()" style="width:100%;margin-top:.75rem">SAVE →</button>
    </div>
    <div class="ps">
      <div class="ps-title">CONTACT LINKS</div>
      <div id="alList"></div>
      <button class="add-btn" onclick="openAddLink()">+ ADD LINK</button>
    </div>
    <div class="ps">
      <div class="ps-title">SESSION</div>
      <button class="btn btn-g" onclick="closePanel()" style="width:100%;margin-bottom:.5rem">LOCK PANEL</button>
      <button class="btn btn-d" onclick="doReset()" style="width:100%">RESET TO DEFAULT</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js" defer></script>
</body>
</html>
